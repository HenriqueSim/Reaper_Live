<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>REAPER Live Controls</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --bg2:       #1a1a1a;
      --bg3:       #242424;
      --border:    #333;
      --text:      #e8e8e8;
      --muted:     #666;
      --green:     #22c55e;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --blue:      #3b82f6;
      --active-bg: #1c3a2b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── LAYOUT ─────────────────────────────────────────── */

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── HEADER ─────────────────────────────────────────── */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.connected  { color: var(--green); }
    .status-dot.connected::before  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.error      { color: var(--red); }
    .status-dot.error::before      { background: var(--red); }

    /* ── TRANSPORT BAR ──────────────────────────────────── */

    .transport {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .play-state {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--bg3);
      color: var(--muted);
      min-width: 90px;
      text-align: center;
    }

    .play-state.playing  { background: var(--active-bg); color: var(--green); }
    .play-state.paused   { background: #2a2210; color: var(--amber); }
    .play-state.stopped  { background: var(--bg3); color: var(--muted); }

    .position {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .current-region-name {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-region-name span {
      color: var(--green);
      font-weight: 600;
    }

    .repeat-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 3px;
      background: #2a1a08;
      color: var(--amber);
      display: none;
    }

    .repeat-badge.visible { display: block; }

    /* ── LOOP CONTROL ───────────────────────────────────── */

    .loop-section {
      padding: 12px 16px;
      flex-shrink: 0;
    }

    #loop-btn {
      width: 100%;
      height: 72px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg2);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
      user-select: none;
      -webkit-user-select: none;
    }

    #loop-btn:active { transform: scale(0.98); }

    #loop-btn .icon {
      font-size: 22px;
      line-height: 1;
    }

    #loop-btn .label-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    #loop-btn .label-main {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    #loop-btn .label-sub {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--muted);
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #loop-btn.loop-active {
      border-color: var(--amber);
      background: #1f1500;
      color: var(--amber);
    }

    #loop-btn.loop-active .label-sub { color: #a07010; }

    #loop-btn.no-region {
      border-color: var(--red);
      color: var(--red);
    }

    /* ── ERROR TOAST ────────────────────────────────────── */

    #error-toast {
      display: none;
      margin: 0 16px 10px;
      padding: 8px 12px;
      background: #2a0a0a;
      border: 1px solid var(--red);
      border-radius: 6px;
      color: var(--red);
      font-size: 13px;
      flex-shrink: 0;
    }

    #error-toast.visible { display: block; }

    /* ── REGIONS ────────────────────────────────────────── */

    .regions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 8px;
      flex-shrink: 0;
    }

    .regions-header h2 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .reload-btn {
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .reload-btn:hover { color: var(--text); border-color: var(--text); }

    .regions-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      -webkit-overflow-scrolling: touch;
    }

    #regions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    .region-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 12px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
      min-height: 64px;
      user-select: none;
      -webkit-user-select: none;
    }

    .region-btn:active { transform: scale(0.97); }

    .region-btn:hover { background: var(--bg3); border-color: #555; }

    .region-btn.active {
      background: var(--active-bg);
      border-color: var(--green);
    }

    .region-btn.looping {
      background: #1f1500;
      border-color: var(--amber);
    }

    .region-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    .region-btn.active .region-name  { color: var(--green); }
    .region-btn.looping .region-name { color: var(--amber); }

    .region-time {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    /* ── EMPTY / LOADING STATES ─────────────────────────── */

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <h1>Live Controls</h1>
    <div class="status-dot" id="status-dot">Connecting…</div>
  </div>

  <!-- Transport -->
  <div class="transport">
    <div class="play-state stopped" id="play-state">STOPPED</div>
    <div class="position" id="position">0:00</div>
    <div class="current-region-name" id="cur-region-display">—</div>
    <div class="repeat-badge" id="repeat-badge">REPEAT</div>
  </div>

  <!-- Loop button -->
  <div class="loop-section">
    <button id="loop-btn" disabled>
      <span class="icon" id="loop-icon">↺</span>
      <span class="label-text">
        <span class="label-main" id="loop-label-main">LOOP CURRENT REGION</span>
        <span class="label-sub"  id="loop-label-sub">Tap to loop the region under the playhead</span>
      </span>
    </button>
  </div>

  <!-- Error toast -->
  <div id="error-toast"></div>

  <!-- Regions -->
  <div class="regions-header">
    <h2>Regions</h2>
    <button class="reload-btn" id="reload-btn">↺ Reload</button>
  </div>

  <div class="regions-scroll">
    <div id="regions-grid">
      <div class="empty-state"><span class="spinner"></span>Loading…</div>
    </div>
  </div>

</div>

<script>
'use strict';

// ── CONFIGURATION ────────────────────────────────────────────────────────────

const REAPER_HOST  = window.location.hostname || 'localhost';
const REAPER_PORT  = window.location.port     || '8080';
const BASE         = `http://${REAPER_HOST}:${REAPER_PORT}/_`;
const SECTION      = 'ReaperSetlist';
const POLL_MS      = 500;
const LUA_WAIT_MS  = 180;   // time for REAPER to execute the Lua script

// ── STATE ────────────────────────────────────────────────────────────────────

let scriptActionId = null;   // e.g. "_RSa1b2c3d4"
let regions        = [];     // [{id, name, start_pos, end_pos}, …]
let currentPos     = 0;
let repeatOn       = false;
let playState      = 0;
let loopedRegion   = null;   // region that is currently being looped
let busy           = false;  // prevent overlapping Lua calls

// ── REAPER HTTP API ──────────────────────────────────────────────────────────

async function reaperBatch(cmds) {
  const url = `${BASE}/${cmds.join(';')}`;
  const r = await fetch(url, { signal: AbortSignal.timeout(3000) });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return (await r.text()).split('\n').filter(l => l.trim() !== '');
}

async function reaperSingle(cmd) {
  const lines = await reaperBatch([cmd]);
  return lines;
}

/**
 * Parse EXTSTATE response line.
 * Format: "EXTSTATE\t{section}\t{key}\t{value}"  (4 fields)
 *      or "EXTSTATE\t{section}\t{key}"           (3 fields = empty value)
 */
function parseExtState(line) {
  if (!line) return null;
  const parts = line.split('\t');
  if (parts[0] !== 'EXTSTATE') return null;
  return parts.length >= 4 ? parts.slice(3).join('\t') : '';
}

async function getExtState(key) {
  const lines = await reaperSingle(`GET/EXTSTATE/${SECTION}/${key}`);
  return parseExtState(lines[0] || '');
}

async function getExtStatePersist(key) {
  const lines = await reaperSingle(`GET/EXTSTATE_PERSIST/${SECTION}/${key}`);
  return parseExtState(lines[0] || '');
}

/**
 * Run a Lua operation via the reaper-setlist script.
 * params = {key: value, …} are written to ExtState before triggering.
 * After triggering we wait LUA_WAIT_MS for REAPER to execute.
 */
async function runLuaOp(operation, params = {}) {
  if (!scriptActionId) throw new Error('Script action ID not set');
  const cmds = [];
  for (const [k, v] of Object.entries(params)) {
    cmds.push(`SET/EXTSTATE/${SECTION}/${k}/${encodeURIComponent(String(v))}`);
  }
  cmds.push(`SET/EXTSTATE/${SECTION}/Operation/${encodeURIComponent(operation)}`);
  cmds.push(scriptActionId);
  await reaperBatch(cmds);
  await sleep(LUA_WAIT_MS);
}

async function getTransport() {
  const lines = await reaperSingle('TRANSPORT');
  if (!lines[0]) return null;
  const p = lines[0].split('\t');
  if (p.length < 4 || p[0] !== 'TRANSPORT') return null;
  return {
    playState:       parseInt(p[1], 10),
    positionSeconds: parseFloat(p[2]),
    repeatOn:        p[3] === '1',
    positionString:  p[4] || '0:00',
  };
}

// ── REGIONS ──────────────────────────────────────────────────────────────────

async function loadRegions() {
  setRegionsHTML('<div class="empty-state"><span class="spinner"></span>Loading regions…</div>');
  try {
    await runLuaOp('getRegions');
    const raw = await getExtState('regions');
    if (raw === null || raw === '') {
      setRegionsHTML('<div class="empty-state">No regions found in the project.<br>Create regions in REAPER and tap Reload.</div>');
      return;
    }
    const parsed = JSON.parse(raw);
    regions = parsed.sort((a, b) => a.start_pos - b.start_pos);
    renderRegions();
  } catch (e) {
    setRegionsHTML(`<div class="empty-state">Error loading regions:<br>${e.message}</div>`);
    throw e;
  }
}

function getCurrentRegion() {
  for (const r of regions) {
    if (currentPos >= r.start_pos && currentPos < r.end_pos) return r;
  }
  return null;
}

async function seekToRegion(region) {
  if (busy) return;
  busy = true;
  try {
    await runLuaOp('seekTo', { seekPosition: region.start_pos });
  } catch (e) {
    showError('Seek failed: ' + e.message);
  } finally {
    busy = false;
  }
}

// ── LOOP CONTROL ─────────────────────────────────────────────────────────────

async function enableLoop() {
  const region = getCurrentRegion();
  if (!region) {
    showError('Playhead is not inside any region — move into a region first');
    flashLoopBtn();
    return;
  }
  loopedRegion = region;
  await runLuaOp('setLoopToRegion', {
    loopStart: region.start_pos,
    loopEnd:   region.end_pos,
  });
}

async function disableLoop() {
  await runLuaOp('disableLoop');
  loopedRegion = null;
}

async function handleLoopBtn() {
  if (busy) return;
  busy = true;
  try {
    if (repeatOn) {
      await disableLoop();
    } else {
      await enableLoop();
    }
  } catch (e) {
    showError('Loop toggle failed: ' + e.message);
  } finally {
    busy = false;
  }
}

// ── RENDER ───────────────────────────────────────────────────────────────────

function fmt(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

const playStateLabels = { 0: 'STOPPED', 1: 'PLAYING', 2: 'PAUSED', 5: 'REC' };
const playStateCls    = { 0: 'stopped', 1: 'playing', 2: 'paused',  5: 'playing' };

function updateTransportUI(t) {
  // Position & play state
  document.getElementById('position').textContent  = fmt(t.positionSeconds);
  const psEl = document.getElementById('play-state');
  psEl.textContent = playStateLabels[t.playState] || `STATE ${t.playState}`;
  psEl.className   = `play-state ${playStateCls[t.playState] || 'stopped'}`;

  // Repeat badge
  document.getElementById('repeat-badge').classList.toggle('visible', t.repeatOn);

  // Current region display
  const cur = getCurrentRegion();
  const curEl = document.getElementById('cur-region-display');
  curEl.innerHTML = cur
    ? `<span>${cur.name}</span>`
    : '—';

  // Loop button state
  updateLoopBtn(t.repeatOn, loopedRegion || cur);

  // Region button highlights
  document.querySelectorAll('.region-btn').forEach(btn => {
    const id = parseInt(btn.dataset.id, 10);
    const isCurrent = cur && cur.id === id;
    const isLooping = repeatOn && loopedRegion && loopedRegion.id === id;
    btn.classList.toggle('active',   isCurrent && !isLooping);
    btn.classList.toggle('looping',  isLooping);
  });
}

function updateLoopBtn(isLooping, region) {
  const btn      = document.getElementById('loop-btn');
  const iconEl   = document.getElementById('loop-icon');
  const mainEl   = document.getElementById('loop-label-main');
  const subEl    = document.getElementById('loop-label-sub');

  if (isLooping && region) {
    btn.classList.add('loop-active');
    btn.classList.remove('no-region');
    iconEl.textContent = '↺';
    mainEl.textContent = 'LOOPING — TAP TO STOP';
    subEl.textContent  = region.name;
  } else {
    btn.classList.remove('loop-active', 'no-region');
    iconEl.textContent = '↺';
    mainEl.textContent = 'LOOP CURRENT REGION';
    subEl.textContent  = region
      ? `Will loop: ${region.name}`
      : 'Move playhead inside a region first';
  }
}

function flashLoopBtn() {
  const btn = document.getElementById('loop-btn');
  btn.classList.add('no-region');
  setTimeout(() => btn.classList.remove('no-region'), 1200);
}

function renderRegions() {
  const grid = document.getElementById('regions-grid');
  if (regions.length === 0) {
    grid.innerHTML = '<div class="empty-state">No regions found.<br>Create regions in REAPER and tap Reload.</div>';
    return;
  }
  grid.innerHTML = '';
  regions.forEach(region => {
    const btn = document.createElement('button');
    btn.className      = 'region-btn';
    btn.dataset.id     = region.id;
    btn.innerHTML = `
      <span class="region-name">${escapeHtml(region.name)}</span>
      <span class="region-time">${fmt(region.start_pos)} – ${fmt(region.end_pos)}</span>
    `;
    btn.addEventListener('click', () => seekToRegion(region));
    grid.appendChild(btn);
  });
}

function setRegionsHTML(html) {
  document.getElementById('regions-grid').innerHTML = html;
}

function setStatus(text, kind = 'connecting') {
  const el = document.getElementById('status-dot');
  el.textContent = text;
  el.className   = `status-dot ${kind}`;
}

function showError(msg) {
  const el = document.getElementById('error-toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('visible'), 4000);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ── INIT & POLL ───────────────────────────────────────────────────────────────

async function init() {
  setStatus('Connecting…', 'connecting');
  try {
    // Probe the API first so we get a clear error if REAPER isn't reachable
    let rawLine;
    try {
      const lines = await reaperSingle('GET/EXTSTATE/ReaperSetlist/ScriptActionId');
      rawLine = lines[0] || '(empty response)';
    } catch (e) {
      throw new Error(`Cannot reach REAPER at ${BASE} — ${e.message}`);
    }

    const aid = parseExtState(rawLine);
    if (!aid) {
      // Show the raw response to help diagnose format issues
      throw new Error(
        `ScriptActionId not found or empty.\n` +
        `Raw response: "${rawLine}"\n` +
        `Run reaper-setlist.lua once inside REAPER to register the script.`
      );
    }
    scriptActionId = aid;

    document.getElementById('loop-btn').disabled = false;
    setStatus('Connected', 'connected');

    await loadRegions();
    startPolling();
  } catch (e) {
    setStatus('Connection failed', 'error');
    setRegionsHTML(`<div class="empty-state">${e.message.replace(/\n/g, '<br>')}<br><br>Make sure REAPER is running and the web server is enabled.</div>`);
    setTimeout(init, 4000);
  }
}

let pollTimer = null;

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, POLL_MS);
}

async function poll() {
  try {
    const t = await getTransport();
    if (!t) return;
    currentPos = t.positionSeconds;
    repeatOn   = t.repeatOn;
    playState  = t.playState;
    updateTransportUI(t);
    setStatus('Connected', 'connected');
  } catch (_) {
    setStatus('Reconnecting…', 'error');
  }
}

// ── EVENT LISTENERS ───────────────────────────────────────────────────────────

document.getElementById('loop-btn').addEventListener('click', handleLoopBtn);
document.getElementById('reload-btn').addEventListener('click', () => {
  if (!scriptActionId) return;
  loadRegions().catch(e => showError(e.message));
});

// ── GO ────────────────────────────────────────────────────────────────────────

init();
</script>
</body>
</html>
